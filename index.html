async function initPdfGenerate() {
  if(!window.pdfjsLib) { alert('PDF.jsがまだ読み込まれていません'); return; }
  const buf = await idbGet(_pdfGen.fileName);
  if(!buf) { alert('PDFがアプリ内にありません。先にアップロードしてください。'); showView('site-detail'); return; }
  try {
    const loadingTask = pdfjsLib.getDocument({data: buf.slice(0)});
    _pdfGen.pdfDoc = await loadingTask.promise;
    _pdfGen.numPages = _pdfGen.pdfDoc.numPages;
    if(_pdfGen.currentPage > _pdfGen.numPages) _pdfGen.currentPage = 1;
    await renderPdfGenPage();
    // フォーカスして矢印キー受け取り
    document.getElementById('pdfgen-canvas-wrap')?.focus();
  } catch(e) { alert('PDFの読み込みに失敗しました: ' + e.message); }
}

async function renderPdfGenPage() {
  const page = await _pdfGen.pdfDoc.getPage(_pdfGen.currentPage);
  const viewport = page.getViewport({scale: _pdfGen.scale});
  const base = page.getViewport({scale: 1});
  _pdfGen.pageSize = {width: base.width, height: base.height};
  const canvas = document.getElementById('pdfgen-canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
  const click = document.getElementById('pdfgen-click-layer');
  const overlay = document.getElementById('pdfgen-overlay');
  if(click) { click.style.width = viewport.width+'px'; click.style.height = viewport.height+'px'; }
  if(overlay) { overlay.style.width = viewport.width+'px'; overlay.style.height = viewport.height+'px'; }
  document.getElementById('pdfgen-page-info').textContent = _pdfGen.currentPage + ' / ' + _pdfGen.numPages;
  document.getElementById('pdfgen-scale').textContent = Math.round(_pdfGen.scale*100) + '%';
  drawPdfGenMarkers();
  renderPdfGenExtraList();
  renderPdfGenMappingImageList();
}

function pdfGenPrevPage() { if(_pdfGen.currentPage>1){ _pdfGen.currentPage--; renderPdfGenPage(); } }
function pdfGenNextPage() { if(_pdfGen.currentPage<_pdfGen.numPages){ _pdfGen.currentPage++; renderPdfGenPage(); } }
function pdfGenZoom(d) { _pdfGen.scale = Math.max(0.5, Math.min(3, _pdfGen.scale + d)); renderPdfGenPage(); }

// マッピングフィールドと追加配置の両方を描画
function drawPdfGenMarkers() {
  const overlay = document.getElementById('pdfgen-overlay');
  if(!overlay) return;
  const site = getSite(_pdfGen.siteId);
  const mapping = state.pdfMappings[_pdfGen.fileName];
  const mFields = mapping ? mapping.fields.filter(f => f.page === _pdfGen.currentPage) : [];
  const extras = _pdfGen.extras.filter(e => e.page === _pdfGen.currentPage);
  const siteImages = _getSitePdfImages(_pdfGen.siteId, _pdfGen.fileName);

  let html = '';
  // マッピング済フィールド（緑：テキスト・編集不可 / 紫：画像枠・クリックで画像アップロード）
  mFields.forEach(f => {
    if(f.type === 'image') {
      const w = (f.width||100) * _pdfGen.scale;
      const h = (f.height||100) * _pdfGen.scale;
      const left = f.x * _pdfGen.scale;
      const top = (_pdfGen.pageSize.height - f.y) * _pdfGen.scale - h;
      const dataUrl = siteImages[f.id];
      const labelText = (f.label||'画像枠').substring(0,16);
      if(dataUrl) {
        html += `<div onclick="pdfGenUploadMappingImage('${f.id}')" title="クリックで画像を差し替え"
          style="position:absolute;left:${left}px;top:${top}px;width:${w}px;height:${h}px;background:url(${dataUrl}) center/contain no-repeat #fff;border:2px solid #16a34a;cursor:pointer;pointer-events:auto;"></div>`;
      } else {
        html += `<div onclick="pdfGenUploadMappingImage('${f.id}')" title="クリックして画像をアップロード"
          style="position:absolute;left:${left}px;top:${top}px;width:${w}px;height:${h}px;border:2px dashed #9333ea;background:rgba(147,51,234,0.08);cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;text-align:center;color:#7e22ce;font-size:11px;font-weight:600;">
          <span style="font-size:22px;">🖼</span>
          <span>${labelText}</span>
          <span style="font-size:10px;font-weight:400;">クリックして画像をアップロード</span>
        </div>`;
      }
      return;
    }
    const cx = f.x * _pdfGen.scale;
    const cy = (_pdfGen.pageSize.height - f.y) * _pdfGen.scale;
    const value = resolvePdfValue(f.sourceField, site, f);
    const display = (value||'(空)').substring(0, 24);
    html += `<div style="position:absolute;left:${cx}px;top:${cy}px;transform:translate(0,-50%);background:rgba(34,197,94,0.85);color:#fff;font-size:${(f.fontSize||10)*0.9}px;padding:1px 4px;border-radius:2px;white-space:nowrap;pointer-events:none;">${display}</div>`;
  });
  // 追加配置
  extras.forEach(e => {
    const cx = e.x * _pdfGen.scale;
    const cy = (_pdfGen.pageSize.height - e.y) * _pdfGen.scale;
    const sel = e.id === _pdfGen.selectedExtraId;
    if(e.type === 'text') {
      html += `<div data-eid="${e.id}" onmousedown="pdfGenExtraStartDrag(event,'${e.id}')" style="position:absolute;left:${cx}px;top:${cy}px;transform:translate(0,-50%);background:${sel?'rgba(220,38,38,0.9)':'rgba(59,130,246,0.85)'};color:#fff;font-size:${(e.fontSize||10)*0.9}px;padding:1px 4px;border-radius:2px;cursor:move;pointer-events:auto;white-space:nowrap;user-select:none;${sel?'box-shadow:0 0 0 2px #fbbf24;':''}">${(e.text||'(空)').substring(0,20)}</div>`;
    } else if(e.type === 'image') {
      const w = (e.width||100) * _pdfGen.scale;
      const h = (e.height||100) * _pdfGen.scale;
      html += `<div data-eid="${e.id}" onmousedown="pdfGenExtraStartDrag(event,'${e.id}')" style="position:absolute;left:${cx}px;top:${cy - h}px;width:${w}px;height:${h}px;background:url(${e.dataUrl}) center/contain no-repeat;border:2px ${sel?'solid #dc2626':'dashed #9333ea'};cursor:move;pointer-events:auto;user-select:none;${sel?'box-shadow:0 0 0 2px #fbbf24;':''}"></div>`;
    }
  });
  overlay.innerHTML = html;
}

// クリックレイヤークリック → 何もしない（テキスト/画像は専用ボタンから追加）

function pdfGenSelectExtra(id) {

  const x = _pdfGen.pageSize.width / 2;

async function pdfGenAddExtraImage(input) {
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    const img = new Image();
    img.onload = () => {
      const id = 'ex_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
      // 初期サイズ：ページ幅の1/3、比率保持
      const targetW = _pdfGen.pageSize.width / 3;
      const ratio = img.height / img.width;
      const targetH = targetW * ratio;
      const x = _pdfGen.pageSize.width / 4;
      const y = _pdfGen.pageSize.height / 2;
      _pdfGen.extras.push({id, type:'image', page:_pdfGen.currentPage, x, y, width:targetW, height:targetH, dataUrl, mime:file.type});
      _pdfGen.selectedExtraId = id;
      drawPdfGenMarkers();
      renderPdfGenExtraList();
      _saveSitePdfExtras(_pdfGen.siteId, _pdfGen.fileName);
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(file);
  input.value = '';
}
function pdfGenUpdateExtra(id, key, val) {
  const e = _pdfGen.extras.find(x => x.id === id); if(!e) return;
  e[key] = val;
  drawPdfGenMarkers();
  if(key === 'text') renderPdfGenExtraList();
  _saveSitePdfExtras(_pdfGen.siteId, _pdfGen.fileName);
}
function pdfGenDeleteExtra(id) {
  if(!confirm('この追加配置を削除しますか？')) return;
  _pdfGen.extras = _pdfGen.extras.filter(x => x.id !== id);
  if(_pdfGen.selectedExtraId === id) _pdfGen.selectedExtraId = null;
  drawPdfGenMarkers();
  renderPdfGenExtraList();
  _saveSitePdfExtras(_pdfGen.siteId, _pdfGen.fileName);
}

// 追加配置のドラッグ
let _pdfGenDrag = null;
function pdfGenExtraStartDrag(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  const e = _pdfGen.extras.find(x => x.id === id); if(!e) return;
  _pdfGenDrag = { id, startX:ev.clientX, startY:ev.clientY, origX:e.x, origY:e.y, moved:false };
  document.addEventListener('mousemove', pdfGenOnMouseMove);
  document.addEventListener('mouseup', pdfGenOnMouseUp);
}
function pdfGenOnMouseMove(ev) {
  if(!_pdfGenDrag) return;
  const dx = (ev.clientX - _pdfGenDrag.startX) / _pdfGen.scale;
  const dy = (ev.clientY - _pdfGenDrag.startY) / _pdfGen.scale;
  if(Math.abs(dx)>2 || Math.abs(dy)>2) _pdfGenDrag.moved = true;
  const e = _pdfGen.extras.find(x => x.id === _pdfGenDrag.id); if(!e) return;
  e.x = Math.round((_pdfGenDrag.origX + dx)*10)/10;
  e.y = Math.round((_pdfGenDrag.origY - dy)*10)/10;
  drawPdfGenMarkers();
}
function pdfGenOnMouseUp() {
  document.removeEventListener('mousemove', pdfGenOnMouseMove);
  document.removeEventListener('mouseup', pdfGenOnMouseUp);
  if(!_pdfGenDrag) return;
  const id = _pdfGenDrag.id; const moved = _pdfGenDrag.moved;
  _pdfGenDrag = null;
  if(moved) {
    if(_pdfGen.selectedExtraId === id) renderPdfGenExtraDetail();
    _saveSitePdfExtras(_pdfGen.siteId, _pdfGen.fileName);
  } else {
    pdfGenSelectExtra(id);
  }
}

// 矢印キーで選択中の追加配置を移動
function pdfGenOnKeydown(ev) {
  if(!_pdfGen.selectedExtraId) return;
  const e = _pdfGen.extras.find(x => x.id === _pdfGen.selectedExtraId); if(!e) return;
  const step = ev.shiftKey ? 5 : 1;
  let handled = true;
  if(ev.key === 'ArrowLeft')  e.x -= step;
  else if(ev.key === 'ArrowRight') e.x += step;
  else if(ev.key === 'ArrowUp')    e.y += step;
  else if(ev.key === 'ArrowDown')  e.y -= step;
  else if(ev.key === 'Delete' || ev.key === 'Backspace') { pdfGenDeleteExtra(_pdfGen.selectedExtraId); return; }
  else handled = false;
  if(handled) {
    ev.preventDefault();
    e.x = Math.round(e.x*10)/10; e.y = Math.round(e.y*10)/10;
    drawPdfGenMarkers(); renderPdfGenExtraDetail();
    _saveSitePdfExtras(_pdfGen.siteId, _pdfGen.fileName);
  }
}

// PDF出力（pdf-lib）— 英数字のみ正常、日本語は文字化け（次フェーズで日本語フォント対応）
async function downloadGeneratedPdf() {
  const fileName = _pdfGen.fileName;
  const site = getSite(_pdfGen.siteId);
  if(!fileName || !site) return;
  const buf = await idbGet(fileName);
  if(!buf) { alert('PDFがアプリ内にありません'); return; }
  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;
    const pdfDoc = await PDFDocument.load(buf.slice(0));
    const helv = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const pages = pdfDoc.getPages();
    const mapping = state.pdfMappings[fileName];
    const fields = mapping ? mapping.fields : [];
    const siteImages = _getSitePdfImages(_pdfGen.siteId, fileName);
    // マッピングフィールドを描画（テキスト＆画像）
    for(const f of fields) {
      const pageIdx = (f.page||1) - 1;
      if(pageIdx < 0 || pageIdx >= pages.length) continue;
      const page = pages[pageIdx];
      if(f.type === 'image') {
        // 画像枠：現場ごとアップロードされた画像を描画
        const entry = siteImages[f.id];
        if(!entry || !entry.dataUrl) continue;
        try {
          const bytes = _dataUrlToBytes(entry.dataUrl);
          let img;
          if((entry.mime||'').includes('png') || entry.dataUrl.startsWith('data:image/png')) img = await pdfDoc.embedPng(bytes);
          else img = await pdfDoc.embedJpg(bytes);
          page.drawImage(img, { x: f.x, y: f.y, width: f.width||100, height: f.height||100 });
        } catch(err) { console.warn('画像枠の埋め込み失敗:', f, err); }
        continue;
      }
      const text = String(resolvePdfValue(f.sourceField, site, f) || '');
      if(!text) continue;
      try {
        page.drawText(text, { x: f.x, y: f.y, size: f.fontSize||10, font: helv, color: rgb(0,0,0) });
      } catch(e) { console.warn('描画失敗:', f, e); }
    }
    // 追加配置（テキスト・画像）を描画
    for(const e of _pdfGen.extras) {
      const pageIdx = (e.page||1) - 1;
      if(pageIdx < 0 || pageIdx >= pages.length) continue;
      const page = pages[pageIdx];
      if(e.type === 'text') {
        const text = String(e.text||'');
        if(!text) continue;
        try { page.drawText(text, { x:e.x, y:e.y, size:e.fontSize||10, font:helv, color:rgb(0,0,0) }); }
        catch(err) { console.warn('追加テキスト描画失敗:', e, err); }
      } else if(e.type === 'image') {
        try {
          const bytes = _dataUrlToBytes(e.dataUrl);
          let img;
          if(e.mime === 'image/png' || (e.dataUrl||'').startsWith('data:image/png')) img = await pdfDoc.embedPng(bytes);
          else img = await pdfDoc.embedJpg(bytes);
          page.drawImage(img, { x:e.x, y:e.y, width:e.width||100, height:e.height||100 });
        } catch(err) { console.warn('画像埋め込み失敗:', err); }
      }
    }
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = site.name.replace(/[\/\\:*?"<>|]/g,'_');
    a.href = url; a.download = safeName + '_' + fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  } catch(err) {
    alert('PDF生成に失敗しました: ' + err.message);
    console.error(err);
  }
}
function _dataUrlToBytes(dataUrl) {
  const base64 = dataUrl.split(',')[1];
  const bin = atob(base64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i=0; i<len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function renderPdfTemplates() {
  const filterCity = window._fltrCity || '';
  const filterSect = window._fltrSect || '';
  const searchQ = (window._fltrQ || '').toLowerCase();
  const editMode = window._formsEditMode || false;

  const CITY_ORDER = ['kishiwada','izumi','sakai','izumiotsu','tadaoka','takaishi','kaizuka','kumatori','izumisano','higashiosaka'];
  const CITY_NAMES = {kishiwada:'岸和田市',izumi:'和泉市',sakai:'堺市',izumiotsu:'泉大津市',tadaoka:'忠岡町',takaishi:'高石市',kaizuka:'貝塚市',kumatori:'熊取町',izumisano:'泉佐野市',higashiosaka:'東大阪市'};

  // キーから区分(sect)を抽出。例: kishiwada_water_temp → water_temp
  const sectFromKey = (key) => {
    const cityPart = (key.match(/^[a-z]+/)||[''])[0];
    return key.substring(cityPart.length + 1); // 先頭の "cityEn_" を除去
  };

  // 全書式のキーセット（FORMS_CATALOG + カスタム追加）
  const allKeys = new Set([...Object.keys(FORMS_CATALOG)]);
  Object.keys(state.formsCustom).forEach(k => { if(state.formsCustom[k]?.length) allKeys.add(k); });

  const SECT_ORDER = ['water','drain','sewer','road','water_temp','drain_temp'];

  let entries = [];
  for (const key of allKeys) {
    const base = FORMS_CATALOG[key] || {};
    const cityEn = base.cityEn || key.split('_')[0];
    const sect = base.sect || sectFromKey(key);
    const cityJp = base.cityJp || CITY_NAMES[cityEn] || cityEn;
    if (filterCity && cityEn !== filterCity) continue;
    if (filterSect && sect !== filterSect) continue;
    const effectiveForms = getEffectiveForms(key);
    const forms = searchQ ? effectiveForms.filter(f=>f.name.toLowerCase().includes(searchQ)) : effectiveForms;
    if (forms.length || editMode) entries.push({key, cityJp, cityEn, sect, forms});
  }
  entries.sort((a,b)=>{
    const ai=CITY_ORDER.indexOf(a.cityEn), bi=CITY_ORDER.indexOf(b.cityEn);
    if(ai!==bi) return (ai<0?99:ai)-(bi<0?99:bi);
    return SECT_ORDER.indexOf(a.sect) - SECT_ORDER.indexOf(b.sect);
  });

  const totalForms = entries.reduce((n,e)=>n+e.forms.length, 0);
  const cityOptions = CITY_ORDER.map(ce=>`<option value="${ce}" ${filterCity===ce?'selected':''}>${CITY_NAMES[ce]||ce}</option>`).join('');

  // 非同期でIDBファイル一覧を更新→ビュー再描画
  if(!_idbFileSet) { refreshIdbFileSet().then(()=> { if(state.view==='pdftemplates') showView('pdftemplates'); }); }
  const idbFiles = _idbFileSet || new Set();
  return `
  <div class="space-y-5">
    <div class="bg-gradient-to-r from-blue-700 to-blue-600 text-white rounded-xl p-5">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h2 class="text-lg font-bold">📂 PDF書式管理</h2>
          <p class="text-blue-200 text-sm mt-0.5">市区町村別の申請書式PDFを管理・印刷</p>
        </div>
        <div class="flex items-center gap-2">
          <div class="bg-white/20 text-white text-sm px-3 py-1.5 rounded-lg">${totalForms}件</div>
          <button onclick="window._formsEditMode=!window._formsEditMode;showView('pdftemplates')"
            class="text-sm px-3 py-1.5 rounded-lg font-medium ${editMode ? 'bg-red-500 text-white' : 'bg-white/20 text-white hover:bg-white/30'}">
            ${editMode ? '✅ 編集完了' : '✏️ 編集モード'}
          </button>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap gap-3 items-center">
      <input type="text" placeholder="書式名で検索..." value="${window._fltrQ||''}" oninput="window._fltrQ=this.value;showView('pdftemplates')" class="border rounded-lg px-3 py-2 text-sm flex-1 min-w-40">
      <select onchange="window._fltrCity=this.value;showView('pdftemplates')" class="border rounded-lg px-3 py-2 text-sm">
        <option value="">全市区町村</option>
        ${cityOptions}
      </select>
      <select onchange="window._fltrSect=this.value;showView('pdftemplates')" class="border rounded-lg px-3 py-2 text-sm">
        <option value="">区分すべて</option>
        ${['water','drain','sewer','road','water_temp','drain_temp'].map(sk=>{const sd=getSectDef(sk);return `<option value="${sk}" ${filterSect===sk?'selected':''}>${sd.icon} ${sd.label}</option>`;}).join('')}
      </select>
      <button onclick="window._fltrCity='';window._fltrSect='';window._fltrQ='';showView('pdftemplates')" class="text-gray-500 text-sm hover:text-red-500">リセット</button>
    </div>

    ${editMode ? `
    <div id="drop-zone"
      ondragover="handleDragOver(event)" ondragleave="handleDragLeave()" ondrop="handleDrop(event)"
      class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-colors cursor-pointer bg-white"
      onclick="document.getElementById('form-file-input').click()">
      <div class="text-4xl mb-3">📄</div>
      <div class="font-bold text-gray-700 mb-1">PDFをここにドロップ</div>
      <div class="text-sm text-gray-500 mb-4">または</div>
      <div class="flex justify-center gap-3">
        <button onclick="event.stopPropagation();document.getElementById('form-file-input').click()"
          class="bg-emerald-600 text-white text-sm px-5 py-2 rounded-lg hover:bg-emerald-700 font-medium">
          📁 ファイルを選択（複数可）
        </button>
        <button onclick="event.stopPropagation();document.getElementById('form-folder-input').click()"
          class="bg-blue-600 text-white text-sm px-5 py-2 rounded-lg hover:bg-blue-700 font-medium">
          🗂 フォルダごと選択
        </button>
      </div>
      <p class="text-xs text-gray-400 mt-4">PDF形式のみ対応。ファイル名の先頭に区分（kishiwada_water_… / _drain_… / _sewer_… / _road_… / _water_temp_… / _drain_temp_…）を付けると自動振分け。違う場合は次の画面で選択できます。</p>
      ${state.formsDeleted.length > 0 ? `<p class="mt-2 text-xs text-red-500 font-medium">⚠️ 現在${state.formsDeleted.length}件を非表示中（設定から復元可能）</p>` : ''}
    </div>
    <div class="bg-red-50 border border-red-200 rounded-xl p-4 mt-3">
      <div class="flex items-start gap-3">
        <div class="text-red-600 font-bold text-sm flex-shrink-0">⚠️ リセット</div>
        <div class="flex-1">
          <p class="text-sm text-red-800 mb-2">登録済みの全PDFファイルとマッピング情報を削除します。やり直す時に使用してください。</p>
          <button onclick="resetAllPdfData()" class="bg-red-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-red-700 font-medium">🗑 全PDFデータを削除</button>
        </div>
      </div>
    </div>
    ` : ''}

    ${FORMS_UNSYNCED.length>0 && !editMode ?`
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900">
      <strong>⚠️ OneDriveで未同期の市区町村</strong> —
      <span class="font-medium">${FORMS_UNSYNCED.join('、')}</span>
      は書式未変換です。OneDriveで「常にこのデバイスに保存」を設定してください。
    </div>
    `:''}

    <div class="space-y-4">
      ${entries.length === 0 ? '<div class="text-center text-gray-400 py-12">一致する書式がありません</div>' :
      entries.map(g=>{
        // 区分ごとの色クラス（Tailwind JIT が拾えるよう静的に書く）
        const COL = {
          water:      {bg:'bg-blue-50',   bd:'border-blue-100',   tb:'text-blue-800',   tm:'text-blue-600',   tl:'text-blue-500',   hb:'hover:border-blue-300',   ht:'hover:text-blue-800',   hbg:'hover:bg-blue-100',   tx:'text-blue-600'},
          drain:      {bg:'bg-amber-50',  bd:'border-amber-100',  tb:'text-amber-800',  tm:'text-amber-600',  tl:'text-amber-500',  hb:'hover:border-amber-300',  ht:'hover:text-amber-800',  hbg:'hover:bg-amber-100',  tx:'text-amber-600'},
          sewer:      {bg:'bg-green-50',  bd:'border-green-100',  tb:'text-green-800',  tm:'text-green-600',  tl:'text-green-500',  hb:'hover:border-green-300',  ht:'hover:text-green-800',  hbg:'hover:bg-green-100',  tx:'text-green-600'},
          road:       {bg:'bg-gray-50',   bd:'border-gray-200',   tb:'text-gray-800',   tm:'text-gray-600',   tl:'text-gray-500',   hb:'hover:border-gray-300',   ht:'hover:text-gray-800',   hbg:'hover:bg-gray-100',   tx:'text-gray-600'},
          water_temp: {bg:'bg-sky-50',    bd:'border-sky-100',    tb:'text-sky-800',    tm:'text-sky-600',    tl:'text-sky-500',    hb:'hover:border-sky-300',    ht:'hover:text-sky-800',    hbg:'hover:bg-sky-100',    tx:'text-sky-600'},
          drain_temp: {bg:'bg-orange-50', bd:'border-orange-100', tb:'text-orange-800', tm:'text-orange-600', tl:'text-orange-500', hb:'hover:border-orange-300',ht:'hover:text-orange-800', hbg:'hover:bg-orange-100', tx:'text-orange-600'},
        };
        const c = COL[g.sect] || COL.water;
        const sd = getSectDef(g.sect);
        const sectLabel = sd.icon + ' ' + sd.label;
        return `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
          <div class="flex items-center gap-3 px-5 py-3 ${c.bg} border-b ${c.bd}">
            <span class="font-bold ${c.tb}">${g.cityJp}</span>
            <span class="text-sm ${c.tm} font-medium">${sectLabel}</span>
            <span class="ml-auto text-xs ${c.tl}">${g.forms.length}件</span>
            ${editMode ? `<button onclick="document.getElementById('form-file-input').dataset.group='${g.key}';document.getElementById('form-file-input').click()" class="ml-2 text-xs bg-emerald-600 text-white px-2 py-1 rounded hover:bg-emerald-700">＋ 追加</button>` : ''}
          </div>
          <div class="p-4">
            ${g.forms.length === 0 ? `<p class="text-xs text-gray-400 text-center py-2">書式がありません</p>` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
              ${g.forms.map(f=>{
                const missing = !idbFiles.has(f.file);
                return `
              <div class="flex items-center gap-2 border ${missing?'border-orange-300 bg-orange-50':(f.custom?'border-emerald-300 bg-emerald-50':'border-gray-200')} rounded-lg px-3 py-2 ${c.hb} transition group">
                ${missing ? '<span class="text-orange-600 text-xs flex-shrink-0 font-bold" title="この端末にPDF本体が無い">⚠</span>' : (f.custom ? '<span class="text-emerald-600 text-xs flex-shrink-0" title="カスタム追加">★</span>' : '')}
                <span class="text-xs ${missing?'text-orange-700':'text-gray-700'} flex-1 leading-tight">${f.name}${missing?'<span class="text-[10px] text-orange-600"> (未アップロード)</span>':''}</span>
                ${editMode
                  ? `<button onclick="deleteForm('${f.file.replace(/'/g,"\\'")}');event.stopPropagation()" title="非表示にする"
                      class="text-red-500 hover:text-red-700 text-xs px-1.5 py-0.5 rounded hover:bg-red-100 flex-shrink-0 font-bold">✕</button>`
                  : `${missing ? '' : `<button onclick="openForm('${f.file.replace(/'/g,"\\'")}',event)" title="PDFを開く" class="${c.tx} ${c.ht} text-xs px-2 py-1 rounded ${c.hbg} flex-shrink-0">📄 開く</button>`}
                     <button onclick="openPdfEditor('${f.file.replace(/'/g,"\\'")}');event.stopPropagation()" title="入力位置をマッピング"
                      class="text-purple-600 hover:text-purple-800 text-xs px-2 py-1 rounded hover:bg-purple-100 flex-shrink-0 ${state.pdfMappings[f.file]?'font-bold':''}" ${missing?'disabled style="opacity:0.5"':''}>🗺 ${state.pdfMappings[f.file]?'編集':'マッピング'}</button>`
                }
              </div>`;}).join('')}
            </div>`}
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm text-gray-600">
      <strong>💡 使い方</strong>：「📄 開く」でPDFを新規タブに表示 → ブラウザの印刷（Ctrl+P）で印刷。
      書式の追加は右上「✏️ 編集モード」→ ドロップゾーンにPDFをドラッグ、またはボタンでファイル・フォルダを選択。削除は各書式の「✕」ボタン。
    </div>
  </div>`;
}

// ============================================================
// INIT
// ============================================================
loadState();
document.getElementById('company-name-header').textContent = state.settings.companyName||'会社名未設定';
updateAuthBtn();
showView('dashboard');
// 以前サインインしていれば静かに復元
gsTryAutoSignIn();
</script>
<!-- 書式追加用ファイル入力（非表示） -->
<input type="file" id="form-file-input" multiple accept=".pdf" class="hidden"
  onchange="(function(el){
    const group=el.dataset.group;
    if(group){
      // 特定グループへの追加
      Array.from(el.files).filter(f=>f.name.toLowerCase().endsWith('.pdf')).forEach(async f=>{
        const buf=await f.arrayBuffer(); await idbSave(f.name,buf); _addFormToGroup(group,f.name); saveState();
      });
      el.dataset.group=''; showView('pdftemplates');
    } else {
      processFiles(el.files);
    }
    el.value='';
  })(this)">
<input type="file" id="form-folder-input" multiple accept=".pdf" webkitdirectory class="hidden"
  onchange="processFiles(this.files);this.value=''">
</body>
</html>
